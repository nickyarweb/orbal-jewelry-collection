<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thank you · ORBAL Jewelry Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@1,500&family=Mulish:wght@400;700&display=swap">
<style>
:root{--ivory:#f8f2e8;--white:#fffcf7;--ink:#2a1a17;--muted:#6f5d55;--ruby:#7d1628;--gold:#b08a45;--line:rgba(42,26,23,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ivory);color:var(--ink);font-family:"Mulish","Segoe UI",sans-serif;padding:24px max(16px, env(safe-area-inset-left, 0px))}
.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:48px 36px;max-width:560px;width:100%;text-align:center;display:grid;gap:16px;justify-items:center}
.card img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:1px solid #d8bf8a}
.check{width:58px;height:58px;border-radius:50%;background:var(--ruby);color:#fff;display:grid;place-items:center;font-size:28px}
h1{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,44px);margin:0;line-height:1.1}
h1 em{font-family:"Cormorant Garamond",Georgia,serif;color:var(--ruby)}
p{margin:0;color:var(--muted);line-height:1.6;max-width:42ch}
.btn{display:inline-flex;padding:15px 26px;border-radius:999px;background:var(--ruby);color:#fff;text-decoration:none;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;margin-top:8px}
a{color:var(--ruby)}
.fa{font-family:Tahoma,sans-serif;color:var(--gold);font-size:24px}
</style>
</head>
<body>
<main class="card">
  <div class="check" aria-hidden="true">✓</div>
  <h1>Thank you for your <em>order!</em></h1>
  <p>Your payment was successful. A receipt is on its way to your email, and we’ll let you know as soon as your jewelry ships.</p>
  <p>Questions about your order? Email <a href="mailto:info@orbaljewelrycollection.com">info@orbaljewelrycollection.com</a>.</p>
  <a class="btn" href="/">Back to the shop</a>
  <span class="fa" lang="fa">اوربل</span>
</main>
<script>
  try { localStorage.removeItem("orbal-cart-v1"); } catch (e) {}
</script>
</body>
</html>
